<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Défavorisation Laurentides : 2. Ajout des données</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
  <style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
  <!-- >>> AJOUT ÉTAPE 2 : les données, sous forme de fichier JavaScript >>> -->
  <script src="laurentides_defavorisation.js"></script>
  <!-- ce fichier crée la variable "donnees" (votre GeoJSON précédé de const donnees =) -->
  <script>
    // Initialiser la carte centrée sur les Laurentides
    const carte = L.map('map').setView([46.5, -74.5], 8);

    // Ajouter le fond de carte du gouvernement du Québec (réseau routier, toponymie)
    // {-y} : ce service numérote les rangées de tuiles du bas vers le haut (format TMS)
    L.tileLayer('https://geoegl.msp.gouv.qc.ca/carto/tms/1.0.0/carte_gouv_qc_public@EPSG_3857/{z}/{x}/{-y}.png', {
      attribution: '© Gouvernement du Québec | Santé Québec Laurentides, DSP'
    }).addTo(carte);

    // >>> DÉBUT AJOUT ÉTAPE 2 >>>
    // Fonction de couleur : une couleur par quintile, même palette (RdYlGn)
    // que la symbologie QGIS du module 2. Q1 = moins défavorisé, Q5 = plus défavorisé.
    function getCouleur(q) {
      q = Number(q); // accepte aussi un quintile stocké en texte ("5")
      return q === 5 ? '#d73027' :  // Q5 : rouge (plus défavorisé)
             q === 4 ? '#fc8d59' :  // Q4 : orange
             q === 3 ? '#fee090' :  // Q3 : jaune pâle
             q === 2 ? '#91cf60' :  // Q2 : vert clair
             q === 1 ? '#1a9850' :  // Q1 : vert foncé (moins défavorisé)
                       '#cccccc';   // gris : donnée manquante ou invalide
    } // fin getCouleur()

    // Afficher les municipalités : "donnees" vient du fichier laurentides_defavorisation.js
    L.geoJSON(donnees, {
      style: function(feature) {
        return {
          fillColor: getCouleur(feature.properties.defav_mat_quintile),
          weight: 1,
          opacity: 1,
          color: 'white',
          fillOpacity: 0.75
        };
      } // fin style
    }).addTo(carte); // fin L.geoJSON({...})
    // <<< FIN AJOUT ÉTAPE 2 <<<

    // ✅ Résultat attendu : les 89 municipalités s'affichent, colorées
    // selon le quintile de défavorisation matérielle (defav_mat_quintile).
    // Pas encore de popup ni de légende : ce sera l'étape 3.
  </script>
</body>
</html>
